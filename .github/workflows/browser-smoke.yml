name: Browser lab smoke tests
on:
  push:
    branches: [main]
    paths: ['labs/**','tools/browser-smoke.py','.github/workflows/browser-smoke.yml']
  pull_request:
    paths: ['labs/**','tools/browser-smoke.py','.github/workflows/browser-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise seven labs in Chromium at desktop and mobile sizes
        run: python tools/browser-smoke.py
