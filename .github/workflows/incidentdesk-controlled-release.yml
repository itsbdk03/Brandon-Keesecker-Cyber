name: IncidentDesk controlled Pages release
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: incidentdesk-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and domain logic
        run: |
          node --check incidentdesk/app.js
          node --check incidentdesk/operations.js
          node --test incidentdesk/tests/*.test.cjs
      - name: Require verified staging authorization
        env:
          STAGING_DATABASE_URL: ${{ secrets.INCIDENTDESK_STAGING_DATABASE_URL }}
          PGSSLMODE: require
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo 'BLOCKED: Add INCIDENTDESK_STAGING_DATABASE_URL secret; no release without staging validation.'
            exit 1
          fi
          psql "$STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f incidentdesk/tests/rls-transactional.sql
          psql "$STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f incidentdesk/tests/operations-rls-transactional.sql
          psql "$STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f incidentdesk/tests/extended-rls-transactional.sql
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy static portfolio and IncidentDesk
        id: deployment
        uses: actions/deploy-pages@v4