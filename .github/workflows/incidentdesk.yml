name: IncidentDesk application verification
on:
  push:
    branches: [main]
    paths: ['incidentdesk/**', '.github/workflows/incidentdesk.yml']
  pull_request:
    paths: ['incidentdesk/**', '.github/workflows/incidentdesk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate IncidentDesk JavaScript
        run: |
          node --check incidentdesk/model.js
          node --check incidentdesk/app.js
          node --check incidentdesk/config.js
          node --test incidentdesk/tests/*.test.cjs
      - name: Install Chromium testing dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise desktop and mobile demo UI
        run: python incidentdesk/tests/browser_smoke.py