name: Verify portfolio and security labs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Audit tracked files for accidental credentials
        run: npm run audit:security
      - name: Run portable rules and graph tests
        run: npm run verify
